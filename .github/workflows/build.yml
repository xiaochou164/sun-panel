name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build frontend
        run: |
          pnpm run build > build_error.log 2>&1 || (cat build_error.log; exit 1)
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: build_error.log
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  build-backend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: service/go.sum
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      - name: Build backend assets
        working-directory: ./service
        run: |
          go install -a -v github.com/go-bindata/go-bindata/...@latest
          go install -a -v github.com/elazarl/go-bindata-assetfs/...@v1.0.1
          export PATH=$PATH:$(go env GOPATH)/bin
          go-bindata-assetfs -o=assets/bindata.go -pkg=assets assets/...
      - name: Build backend
        working-directory: ./service
        run: |
          go build -o sun-panel --ldflags="-X sun-panel/global.RUNCODE=release" main.go

          GOOS=linux GOARCH=arm64 go build -o sun-panel-arm64 --ldflags="-X sun-panel/global.RUNCODE=release" main.go

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image
        run: |
          docker buildx build --file Dockerfile --platform linux/amd64,linux/arm64 --push --tag ghcr.io/${{ github.repository }}:latest . > build_docker_error.log 2>&1 || (echo "=== DOCKER BUILD FAILED ===" && tail -n 200 build_docker_error.log && exit 1)
      - name: Upload Docker build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-docker-error-log
          path: build_docker_error.log
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sun-panel-linux-amd64
          path: service/sun-panel

      - name: Upload ARM binary
        uses: actions/upload-artifact@v4
        with:
          name: sun-panel-linux-arm64
          path: service/sun-panel-arm64
